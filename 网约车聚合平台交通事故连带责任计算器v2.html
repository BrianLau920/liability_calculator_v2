<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网约车聚合平台交通事故比例连带责任计算器</title>
    <style>
        :root {
            --primary: #1a73e8;
            --danger: #d93025;
            --success: #188038;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --border: #dadce0;
            --text: #202124;
            --text-secondary: #5f6368;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            padding: 30px 20px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 28px;
            margin-bottom: 20px;
        }

        .card h3 {
            font-size: 18px;
            color: var(--primary);
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e8eaed;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card h3 .icon {
            font-size: 22px;
        }

        .form-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .form-row label {
            font-weight: 600;
            min-width: 80px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .form-row input, .form-row select {
            padding: 10px 14px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
            font-family: inherit;
        }

        .form-row input:focus, .form-row select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26,115,232,0.1);
        }

        .form-row input[type="number"] {
            width: 130px;
        }

        .form-row input[type="text"] {
            width: 160px;
        }

        .platform-entry {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .platform-entry span {
            font-weight: 600;
            color: var(--primary);
            min-width: 30px;
        }

        .platform-entry .fixed-value {
            color: var(--text);
            font-weight: normal;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-outline {
            background: white;
            color: var(--primary);
            border: 1.5px solid var(--primary);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-sm {
            padding: 6px 14px;
            font-size: 12px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 16px;
            flex-wrap: wrap;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 14px;
        }

        th {
            background: #e8f0fe;
            color: var(--primary);
            padding: 12px 10px;
            text-align: center;
            font-weight: 700;
            font-size: 13px;
        }

        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #f1f3f4;
        }

        tr:hover td {
            background: #f8f9fa;
        }

        .highlight {
            color: var(--danger);
            font-weight: 700;
        }

        .recourse-section {
            border-left: 4px solid #f9ab00;
            background: #fef7e0;
            padding: 16px;
            border-radius: 0 8px 8px 0;
            margin: 16px 0;
        }

        .recourse-section h4 {
            color: #e37400;
            margin-bottom: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .empty-state .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        @media (max-width: 768px) {
            .form-row {
                flex-direction: column;
                align-items: stretch;
            }
            .form-row input, .form-row select {
                width: 100% !important;
            }
            .platform-entry {
                flex-direction: column;
                align-items: stretch;
            }
            table {
                font-size: 12px;
            }
            th, td {
                padding: 8px 4px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚖️ 网约车聚合平台交通事故比例连带责任计算器</h1>
        </div>

        <!-- 输入区域 -->
        <div class="card">
            <h3><span class="icon">💰</span> 应赔偿金额</h3>
            <div class="form-row">
                <label>金额（元）:</label>
                <input type="number" id="totalComp" min="0" step="0.01" placeholder="请输入赔偿金额" required>
            </div>
        </div>

        <div class="card">
            <h3><span class="icon">👥</span> 侵权主体</h3>
            <div id="platformContainer">
                <div class="platform-entry">
                    <span>主体1</span>
                    <span class="fixed-value">司机</span>
                    <span>责任比例：</span>
                    <span class="fixed-value">100%</span>
                </div>
                <!-- 默认两个平台输入行 -->
                <div class="platform-entry">
                    <span>主体2</span>
                    <input type="text" class="platform-name" value="聚合平台">
                    <label>责任比例 %:</label>
                    <input type="number" class="platform-force" min="0" max="100" step="0.01" placeholder="0-100">
                </div>
                <div class="platform-entry">
                    <span>主体3</span>
                    <input type="text" class="platform-name" value="入驻平台">
                    <label>责任比例 %:</label>
                    <input type="number" class="platform-force" min="0" max="100" step="0.01" placeholder="0-100">
                </div>
            </div>
            <div class="btn-group">
                <button type="button" class="btn btn-outline btn-sm" onclick="addPlatform()">➕ 添加</button>
                <button type="button" class="btn btn-danger btn-sm" onclick="clearPlatforms()">🗑️ 清空</button>
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="step1()">📊 步骤一：比例计算</button>
            <button class="btn btn-outline" onclick="location.reload()">🔄 重置页面</button>
        </div>

        <!-- 结果区域（初始隐藏） -->
        <div id="resultArea" style="display:none;">
            <div class="card">
                <h3><span class="icon">📊</span> 对外责任比例</h3>
                <table id="externalTable"></table>

                <h3 style="margin-top:20px;"><span class="icon">📐</span> 内部责任份额</h3>
                <table id="internalTable"></table>
            </div>

            <!-- 追偿触发条件 -->
            <div class="card">
                <h3><span class="icon">💸</span> 追偿触发条件</h3>
                <div class="form-row">
                    <label>超额支付主体:</label>
                    <select id="recoursePayer"></select>
                </div>
                <div class="form-row">
                    <label>实际承担比例 %:</label>
                    <input type="number" id="recoursePaidRatio" min="0" max="200" step="0.01" placeholder="该主体实际赔偿比例">
                </div>
                <div class="btn-group">
                    <button class="btn btn-success" onclick="step2()">💸 步骤二：追偿计算</button>
                    <button class="btn btn-outline" onclick="resetRecourseForm()">🔄 重置页面</button>
                </div>
            </div>

            <!-- 追偿结果 -->
            <div id="recourseResult" style="display:none;">
                <div class="card" style="border-top: 4px solid #f9ab00;">
                    <h3><span class="icon">💸</span> 追偿计算结果</h3>
                    <div class="recourse-section">
                        <h4>📌 超额支付概况</h4>
                        <table id="excessTable"></table>
                    </div>
                    <h4>📋 追偿明细</h4>
                    <table id="recourseTable"></table>
                    <div class="recourse-section">
                        <h4>✅ 追偿后实际承担</h4>
                        <p id="afterRecourse"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局存储基础计算结果
        let baseResult = null;

        // 添加平台输入行
        function addPlatform() {
            const container = document.getElementById('platformContainer');
            const existing = container.querySelectorAll('.platform-entry:not(:first-child)').length;
            const newIndex = existing + 2; // 司机占主体1，平台从主体2开始
            const div = document.createElement('div');
            div.className = 'platform-entry';
            div.innerHTML = `
                <span>主体${newIndex}</span>
                <input type="text" class="platform-name" placeholder="平台名称">
                <label>责任比例 %:</label>
                <input type="number" class="platform-force" min="0" max="100" step="0.01" placeholder="0-100">
            `;
            container.appendChild(div);
        }

        // 清空平台（保留司机固定行，重置为默认两个平台）
        function clearPlatforms() {
            const container = document.getElementById('platformContainer');
            const rows = container.querySelectorAll('.platform-entry:not(:first-child)');
            rows.forEach(row => row.remove());
            // 添加默认两个平台
            const def1 = document.createElement('div');
            def1.className = 'platform-entry';
            def1.innerHTML = `
                <span>主体2</span>
                <input type="text" class="platform-name" value="聚合平台">
                <label>责任比例 %:</label>
                <input type="number" class="platform-force" min="0" max="100" step="0.01" placeholder="0-100">
            `;
            container.appendChild(def1);
            const def2 = document.createElement('div');
            def2.className = 'platform-entry';
            def2.innerHTML = `
                <span>主体3</span>
                <input type="text" class="platform-name" value="入驻平台">
                <label>责任比例 %:</label>
                <input type="number" class="platform-force" min="0" max="100" step="0.01" placeholder="0-100">
            `;
            container.appendChild(def2);
        }

        // 收集平台数据
        function collectPlatforms() {
            const rows = document.querySelectorAll('#platformContainer .platform-entry:not(:first-child)');
            const platforms = {};
            for (const row of rows) {
                const nameInput = row.querySelector('.platform-name');
                const forceInput = row.querySelector('.platform-force');
                const name = nameInput.value.trim();
                if (!name) continue;
                const force = parseFloat(forceInput.value);
                if (isNaN(force) || force < 0 || force > 100) {
                    alert(`平台 "${name}" 的责任比例必须在 0-100 之间`);
                    return null;
                }
                platforms[name] = force;
            }
            if (Object.keys(platforms).length === 0) {
                alert('请至少添加一个平台');
                return null;
            }
            return platforms;
        }

        // 步骤一：比例计算
        function step1() {
            const totalCompInput = document.getElementById('totalComp');
            const totalComp = parseFloat(totalCompInput.value);
            if (isNaN(totalComp) || totalComp < 0) {
                alert('请输入有效的应赔偿金额');
                return;
            }

            const platforms = collectPlatforms();
            if (!platforms) return;

            // 司机原因力固定100
            const driverForce = 100;

            // 对外责任比例
            const external = {};
            for (const [name, force] of Object.entries(platforms)) {
                external[name] = Math.min(force, driverForce);
            }
            external['司机'] = driverForce;

            const totalExternal = Object.values(external).reduce((a, b) => a + b, 0);

            // 内部责任份额
            const internal = {};
            for (const name in external) {
                internal[name] = external[name] / totalExternal;
            }

            // 构建表格
            const externalTable = document.getElementById('externalTable');
            let extHtml = '<tr><th>责任主体</th><th>责任比例</th></tr>';
            for (const name in external) {
                extHtml += `<tr><td><strong>${name}</strong></td><td>${external[name].toFixed(2)}%</td></tr>`;
            }
            extHtml += `<tr style="background:#e8f0fe;"><td><strong>合计</strong></td><td><span class="highlight">${totalExternal.toFixed(2)}%</span></td></tr>`;
            externalTable.innerHTML = extHtml;

            const internalTable = document.getElementById('internalTable');
            let intHtml = '<tr><th>责任主体</th><th>内部份额</th><th>应赔偿金额</th></tr>';
            let totalInternal = 0;
            for (const name in internal) {
                const amount = totalComp * internal[name];
                totalInternal += amount;
                intHtml += `<tr><td><strong>${name}</strong></td><td>${(internal[name]*100).toFixed(2)}%</td><td><strong>¥ ${amount.toFixed(2)}</strong></td></tr>`;
            }
            intHtml += `<tr style="background:#e6f4ea;"><td><strong>合计</strong></td><td>100%</td><td><strong>¥ ${totalComp.toFixed(2)}</strong></td></tr>`;
            internalTable.innerHTML = intHtml;

            // 填充追偿下拉框
            const payerSelect = document.getElementById('recoursePayer');
            payerSelect.innerHTML = '<option value="">-- 请先选择 --</option>';
            for (const name in external) {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                payerSelect.appendChild(option);
            }

            // 保存基础结果供步骤二使用
            baseResult = {
                platforms: platforms,
                driverForce: driverForce,
                totalComp: totalComp,
                external: external,
                internal: internal,
                totalExternal: totalExternal
            };

            // 显示结果区域，隐藏追偿结果
            document.getElementById('resultArea').style.display = 'block';
            document.getElementById('recourseResult').style.display = 'none';
        }

        // 步骤二：追偿计算
        function step2() {
            if (!baseResult) {
                alert('请先执行步骤一');
                return;
            }
            const payer = document.getElementById('recoursePayer').value;
            const paidRatioStr = document.getElementById('recoursePaidRatio').value.trim();
            if (!payer) {
                alert('请选择超额支付主体');
                return;
            }
            if (paidRatioStr === '') {
                alert('请填写实际承担比例');
                return;
            }
            const paidRatio = parseFloat(paidRatioStr) / 100;
            if (isNaN(paidRatio) || paidRatio < 0) {
                alert('实际承担比例必须为非负数字');
                return;
            }

            const { platforms, driverForce, totalComp, external, internal, totalExternal } = baseResult;

            // 支付方内部份额
            const payerInternalShare = internal[payer];
            const excessRatio = paidRatio - payerInternalShare;
            const excessAmount = totalComp * excessRatio;

            // 其他主体
            const otherNames = Object.keys(internal).filter(n => n !== payer);
            const othersTotalShare = otherNames.reduce((sum, n) => sum + internal[n], 0);

            const recourseDetails = [];
            for (const name of otherNames) {
                const share = internal[name];
                const ratio = excessRatio * (share / othersTotalShare);
                const amount = totalComp * ratio;
                const remainingShare = share - ratio;
                const remainingAmount = totalComp * remainingShare;
                recourseDetails.push({ name, ratio, amount, remainingShare, remainingAmount });
            }

            // 构建超额概况表
            const excessTable = document.getElementById('excessTable');
            let excessHtml = `
                <tr><td>超额支付主体</td><td><strong>${payer}</strong></td></tr>
                <tr><td>超额比例</td><td><span class="highlight">${(excessRatio*100).toFixed(2)}%</span></td></tr>
                <tr><td>超额金额</td><td><strong class="highlight">¥ ${excessAmount.toFixed(2)}</strong></td></tr>
            `;
            excessTable.innerHTML = excessHtml;

            // 构建追偿明细表
            const recourseTable = document.getElementById('recourseTable');
            let recHtml = '<tr><th>追偿对象</th><th>追偿比例</th><th>追偿金额</th><th>追偿后对方剩余</th></tr>';
            for (const detail of recourseDetails) {
                recHtml += `<tr>
                    <td><strong>${detail.name}</strong></td>
                    <td>${(detail.ratio*100).toFixed(2)}%</td>
                    <td><strong>¥ ${detail.amount.toFixed(2)}</strong></td>
                    <td>${(detail.remainingShare*100).toFixed(2)}%（¥ ${detail.remainingAmount.toFixed(2)}）</td>
                </tr>`;
            }
            recourseTable.innerHTML = recHtml;

            // 追偿后支付方实际承担
            const afterRatio = payerInternalShare;
            const afterAmount = totalComp * afterRatio;
            document.getElementById('afterRecourse').innerHTML =
                `比例：<strong>${(afterRatio*100).toFixed(2)}%</strong>&nbsp;&nbsp;|&nbsp;&nbsp;金额：<strong>¥ ${afterAmount.toFixed(2)}</strong>`;

            document.getElementById('recourseResult').style.display = 'block';
        }

        // 仅重置追偿触发条件
        function resetRecourseForm() {
            document.getElementById('recoursePayer').value = '';
            document.getElementById('recoursePaidRatio').value = '';
            document.getElementById('recourseResult').style.display = 'none';
        }
    </script>
</body>
</html>
